*/

            //===========================

            //===========================

            //=============================================================
            // async function getData()
            // - gets results data
            //=============================================================
            async function getData() {
                var url = "https://opensheet.elk.sh/1tjV53jXBchvPRH738JktJglq84hcEB0UpTm4VXTrv20/par3csvsorted";
                try {
                    console.log("timeout delay = " + (getDataRetryCount * 1000 + 2000));
                    const dataStream = await fetch(url, {
                        signal: AbortSignal.timeout(getDataRetryCount * 1000 + 2000)
                    });
                    if (!dataStream.ok) {
                        throw new Error(`Response status: ${dataStream.status}`);
                    } else {
                        data = await dataStream.json();
                        $("#pagetwo").fadeIn(500);
                        document.getElementById("panel").style.display = "none";
                        if (data[0].players.length > 0) {
                            // change < to >
                            //console.log("using useDataResults()");
                            document.getElementById("panel").style.display = "none";
                            document.getElementById("mainpageleft").innerText = "Par 3 Leaderboard";
                            useDataResults();
                        } else {
                            document.getElementById("mainpageleft").innerText = "Monday Tee slots & hcps";
                            useDataHcp();
                        }
                    }
                } catch (err) {
                    console.error(err.message);
                    if (err.name === "TimeoutError") {
                        // This exception is from the abort signal
                        console.error("Timeout: server too busy");
                    } else if (err.name === "AbortError") {
                        // This exception is from the fetch itself
                        console.error("Fetch aborted by user action (browser stop button, closing tab, etc.");
                    } else if (err.name === "TypeError") {
                        console.error("AbortSignal.timeout() method is not supported");
                    } else {
                        // A network error, or some other problem.
                        console.error(`Error: type: ${err.name}, message: ${err.message}`);
                    }
                    // retry
                    getDataRetryCount++;
                    if (getDataRetryCount < 5) {
                        document.getElementsByClassName("load-text")[0].innerText =
                            "retrying " + getDataRetryCount + "/5";
                        sleep(getDataRetryCount * 1000 + 2000);
                        getData();
                    }
                    if (getDataRetryCount == 5) {
                        document.getElementsByClassName("load-text")[0].innerText = "Please try again later.";
                    }
                }
            }

            //=============================================================

            function useDataHcp() {
                let container = document.getElementById("createleaderboarditems");
                // empty container
                container.innerHTML = "";

                // build screen

                data.forEach((el, i) => {
                    let box = document.createElement("div");

                    name.className = "namehcp";

                    let hcps = document.createElement("span");
                    hcps.id = "hcps" + i;
                    hcps.className = "hcps";

                    let tees = document.createElement("span");
                    tees.id = "tees" + i;
                    tees.className = "tees";
                    tees.innerHTML = el.tees;

                    box.appendChild(name);
                    box.appendChild(hcps);
                    box.appendChild(tees);

                    container.appendChild(box);
                    // fade the initial view
                    box.style.opacity = 0.3;
                });

                var k = 0;

                // do proper display
                data.forEach((el, i) => {
                    k++;
                    setTimeout(function () {
                        //console.log("run ... 1", el.hcpplayers, el.hcps);
                        if (el.hcpplayers !== "") {
                            bodyUpdateHcps(el.hcpplayers, el.hcps, i);
                        }
                    }, k * 300);
                });

                document.getElementById("box0").style.borderColor = "white";
                document.getElementById("box1").style.borderColor = "white";
                document.getElementById("box2").style.borderColor = "white";
                document.getElementById("box3").style.borderColor = "white";

                document.getElementById("box5").style.borderColor = "cyan";
                document.getElementById("box6").style.borderColor = "cyan";
                document.getElementById("box7").style.borderColor = "cyan";

                document.getElementById("box10").style.borderColor = "yellow";
                document.getElementById("box11").style.borderColor = "yellow";

                document.getElementById("box13").style.borderColor = "limeGreen";
                document.getElementById("box14").style.borderColor = "limeGreen";
                document.getElementById("box15").style.borderColor = "limeGreen";
            }

            function useDataResults() {
                let container = document.getElementById("createleaderboarditems");

                //console.log(data);
                data.forEach((el, i) => {

                document.getElementById("createleaderboarditems").style.opacity = 1;

                data.forEach((el, i) => {

                        bodyUpdate(el.players, el.total, el.position, i);

            function bodyUpdateHcps(nom, hcps, i) {
                // find the correct data
                data.find((team) => team.players === nom);
                // find the correct place for the data
                let AllTeams = Array.from(document.querySelectorAll(".teamhcp"));
                let element = AllTeams[i];
                let elementName = element.querySelector(".namehcp");
                let elementHcp = element.querySelector(".hcps");
                //console.log(elementName.innerHTML, nom);
                if (elementName.innerHTML == nom) {
                    //console.log("yes " + elementName.innerHTML, nom);
                    elementName.innerHTML = nom;
                    elementHcp.innerHTML = hcps;
                    element.style.opacity = 1;
                }
            }

            function bodyUpdate(nom, points, pos, i) {
                //let pos = i + 1;
                //temp
                //console.log(nom, points, pos, i);
