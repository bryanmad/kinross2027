      * {

      html {

      }

      @keyframes fadeinonload {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Firefox < 16 */
      @-moz-keyframes fadeinonload {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Safari, Chrome and Opera > 12.1 */
      @-webkit-keyframes fadeinonload {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Internet Explorer */
      @-ms-keyframes fadeinonload {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Opera < 12.1 */
      @-o-keyframes fadeinonload {

        to {

        }
      }

      body {

      ::-webkit-scrollbar {

      /* main square menu item */
      .square_menu_icon {
        display: block;
        position: absolute;
        overflow: hidden;
        margin: 0;
        padding: 0;
        width: 45px;
        height: 45px;
        font-size: 0;
        text-indent: -9999px;
        appearance: none;
        box-shadow: none;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
        top: 57%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: transparent;
        z-index: 99;
      }

      .square_menu_icon:focus {
        outline: none;
      }

      .square_menu_icon span {
        display: block;
        position: absolute;
        top: 15px;
        left: 0;
        right: 0;
        height: 7px;
        background: #fff;
      }

      .square_menu_icon span:before,
      .square_menu_icon span:after {
        position: absolute;
        display: block;
        left: 0;
        width: 100%;
        height: 7px;
        background-color: #fff;
        content: "";
      }

      .square_menu_icon span:before {
        top: -14px;
      }

      .square_menu_icon span:after {
        bottom: -14px;
      }

      .square_menu_icon-X span {
        transition: background 0s 0.3s;
      }

      .square_menu_icon-X span:before,
      .square_menu_icon-X span:after {
        transition-duration: 0.3s, 0.3s;
        transition-delay: 0.3s, 0s;
      }

      .square_menu_icon-X span:before {
        transition-property: top, transform;
      }

      .square_menu_icon-X span:after {
        transition-property: bottom, transform;
      }

      .square_menu_icon-X.is-active span {
        background: none;
      }

      .square_menu_icon-X.is-active span:before {
        top: 0;
        transform: rotate(45deg);
      }

      .square_menu_icon-X.is-active span:after {
        bottom: 0;
        transform: rotate(-45deg);
      }

      .square_menu_icon-X.is-active span:before,
      .square_menu_icon-X.is-active span:after {
        transition-delay: 0s, 0.3s;
      }
      /* end of main square menu item */

      /* marquee for temporary use */
      .marquee p {

        height: 100%;
        margin: 0;
        line-height: 60px;
        text-align: center;
        -moz-transform: translateX(100%);
        -webkit-transform: translateX(100%);
        transform: translateX(100%);
        -moz-animation: scroll-right 10s linear;
        -webkit-animation: scroll-right 10s linear;
        animation: scroll-right 10s linear;
      }

      @-moz-keyframes scroll-right {
        0% {
          -moz-transform: translateX(-100%);
        }

        100% {
          -moz-transform: translateX(100%);
        }
      }

      @-webkit-keyframes scroll-right {
        0% {
          -webkit-transform: translateX(-100%);
        }

        100% {
          -webkit-transform: translateX(100%);
        }
      }

      @keyframes scroll-right {
        0% {
          -moz-transform: translateX(-100%);
          -webkit-transform: translateX(-100%);
          transform: translateX(-100%);
        }

        100% {
          -moz-transform: translateX(100%);
          -webkit-transform: translateX(100%);
          transform: translateX(100%);

    <script>
      var SwipeArea = document.querySelector("content");
      var SwipeWidth = window.innerWidth / 2;
      var SwipeWidthMax = 320;

      if (SwipeWidth > SwipeWidthMax) {
        SwipeWidth = SwipeWidthMax;
      }

      var SwipeStartX = null;
      var SwipeEndX = null;
      var SwipeLengthX = null;

      var SwipeStartY = null;
      var SwipeEndY = null;
      var SwipeLengthY = null;

      SwipeArea.addEventListener("touchstart", SwipeStart, false);
      SwipeArea.addEventListener("touchend", SwipeEnd, false);

      function SwipeStart(evt) {
        SwipeStartX = evt.changedTouches[0].clientX;
        SwipeStartY = evt.changedTouches[0].clientY;
      }

      function SwipeEnd(evt) {
        SwipeEndX = evt.changedTouches[0].clientX;
        SwipeEndY = evt.changedTouches[0].clientY;

        SwipeLengthX = SwipeStartX - SwipeEndX;
        SwipeLengthY = SwipeStartY - SwipeEndY;

        if (Math.abs(SwipeLengthX) > Math.abs(SwipeLengthY)) {
          if (SwipeLengthX > SwipeWidth) {
            /* left swipe */
          } else if (SwipeLengthX < -SwipeWidth) {
            /* right swipe */
          }
        }
      }
